[project]
name = "fred"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "mlflow>=3.16.1",
    "openai>=3.13.0",
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
