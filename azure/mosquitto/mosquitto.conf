# FRED Mosquitto
# MQTT over TLS only.

listener 8883 0.0.0.0

allow_anonymous false
password_file /tmp/fred-mqtt-passwords

cafile /tmp/fred-certs/ca.crt
certfile /tmp/fred-certs/server.crt
keyfile /tmp/fred-certs/server.key

# Clients authenticate with MQTT username/password.
# A client certificate is not required.
require_certificate false

persistence false
log_dest stdout